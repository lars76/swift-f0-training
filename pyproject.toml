[project]
name = "swift-f0-training"
version = "0.3.0"
description = "Training code and ONNX export for the SwiftF0 pitch detector."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lars Nieradzik", email = "l.nieradzik@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
    "onnxscript==0.7.2",
    "scipy",
    "soundfile",
    "torch>=2.14,<2.15",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-third-party = ["onnxruntime"]

[tool.ruff.lint.per-file-ignores]
"train.py" = ["SIM113"]
